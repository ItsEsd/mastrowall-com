<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cobra Circuit</title>
    <style>
      /* ---- Layout --------------------------------------------------- */
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        font-family: "Segoe UI", Tahoma, Helvetica, Arial, sans-serif;
        background: #111;
        color: #eee;
      }

      h1 {
        margin: 1rem 0 0.2rem;
        font-size: 2rem;
      }

      #scoreBoard {
        margin-bottom: 0.5rem;
        font-size: 1.2rem;
      }

      /* ---- Game canvas --------------------------------------------- */
      #gameCanvas {
        background: #222;
        border: 4px solid #555;
        border-radius: 12px;
        image-rendering: pixelated; /* keep crisp pixels when scaled */
      }

      /* ---- Mobile controls (optional) ------------------------------ */
      .mobile-controls {
        display: none; /* will become flex on small screens */
        margin-top: 1rem;
        gap: 0.8rem;
      }

      .btn {
        width: 60px;
        height: 60px;
        background: #444;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: #eee;
        user-select: none;
        touch-action: manipulation;
      }

      .btn:active {
        background: #666;
      }

      @media (max-width: 600px) {
        .mobile-controls {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <h1>Cobra Circuit</h1>
    <div id="scoreBoard">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Optional on‑screen buttons for touch devices -->
    <div class="mobile-controls">
      <div class="btn" id="upBtn">⇧</div>
      <div class="btn" id="leftBtn">←</div>
      <div class="btn" id="downBtn">⇩</div>
      <div class="btn" id="rightBtn">→</div>
    </div>

    <script>
      // ---------------------------------------------------------------
      //  Configuration
      // ---------------------------------------------------------------
      const config = {
        canvasSize: 400, // px (square)
        cellSize: 20, // px – each grid cell
        fps: 10, // game speed (frames per second)
        foodColor: "#ff4", // bright yellow
        snakeColor: "#0f0", // bright green
        bgColor: "#222", // board background
      };

      // ---------------------------------------------------------------
      //  Helpers
      // ---------------------------------------------------------------
      const $ = (id) => document.getElementById(id);
      const randInt = (min, max) =>
        Math.floor(Math.random() * (max - min)) + min;

      // ---------------------------------------------------------------
      //  Game State
      // ---------------------------------------------------------------
      const canvas = $("gameCanvas");
      const ctx = canvas.getContext("2d");

      const cols = config.canvasSize / config.cellSize;
      const rows = cols; // square board

      let snake = [{ x: 5, y: 5 }]; // head is index 0
      let direction = { x: 1, y: 0 }; // moving right initially
      let pendingDir = null; // to buffer quick key presses
      let food = null;
      let score = 0;
      let gameLoop = null;

      // ---------------------------------------------------------------
      //  Initialization
      // ---------------------------------------------------------------
      function init() {
        placeFood();
        updateScore();
        document.addEventListener("keydown", handleKey);
        // mobile button listeners
        $("upBtn").addEventListener("click", () => changeDirection(0, -1));
        $("downBtn").addEventListener("click", () => changeDirection(0, 1));
        $("leftBtn").addEventListener("click", () => changeDirection(-1, 0));
        $("rightBtn").addEventListener("click", () => changeDirection(1, 0));

        gameLoop = setInterval(tick, 1000 / config.fps);
      }

      // ---------------------------------------------------------------
      //  Game Loop
      // ---------------------------------------------------------------
      function tick() {
        // apply buffered direction (prevents 180° turn)
        if (pendingDir) {
          direction = pendingDir;
          pendingDir = null;
        }

        // compute new head position
        const newHead = {
          x: (snake[0].x + direction.x + cols) % cols,
          y: (snake[0].y + direction.y + rows) % rows,
        };

        // check self‑collision
        if (snake.some((seg) => seg.x === newHead.x && seg.y === newHead.y)) {
          endGame();
          return;
        }

        // add new head
        snake.unshift(newHead);

        // eat food?
        if (newHead.x === food.x && newHead.y === food.y) {
          score++;
          updateScore();
          placeFood();
          // (do NOT pop tail → snake grows)
        } else {
          // normal move: remove tail
          snake.pop();
        }

        render();
      }

      // ---------------------------------------------------------------
      //  Rendering
      // ---------------------------------------------------------------
      function render() {
        // clear board
        ctx.fillStyle = config.bgColor;
        ctx.fillRect(0, 0, config.canvasSize, config.canvasSize);

        // draw food
        ctx.fillStyle = config.foodColor;
        ctx.fillRect(
          food.x * config.cellSize,
          food.y * config.cellSize,
          config.cellSize,
          config.cellSize
        );

        // draw snake
        ctx.fillStyle = config.snakeColor;
        snake.forEach((seg) => {
          ctx.fillRect(
            seg.x * config.cellSize,
            seg.y * config.cellSize,
            config.cellSize,
            config.cellSize
          );
        });
      }

      // ---------------------------------------------------------------
      //  Input handling
      // ---------------------------------------------------------------
      function handleKey(e) {
        switch (e.key) {
          case "ArrowUp":
          case "w":
            changeDirection(0, -1);
            break;
          case "ArrowDown":
          case "s":
            changeDirection(0, 1);
            break;
          case "ArrowLeft":
          case "a":
            changeDirection(-1, 0);
            break;
          case "ArrowRight":
          case "d":
            changeDirection(1, 0);
            break;
        }
      }

      function changeDirection(dx, dy) {
        // Prevent reversing directly onto itself
        if (dx === -direction.x && dy === -direction.y) return;
        // Buffer the direction until the next tick
        pendingDir = { x: dx, y: dy };
      }

      // ---------------------------------------------------------------
      //  Food placement
      // ---------------------------------------------------------------
      function placeFood() {
        let empty = [];
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            if (!snake.some((seg) => seg.x === x && seg.y === y)) {
              empty.push({ x, y });
            }
          }
        }
        food = empty[randInt(0, empty.length)];
      }

      // ---------------------------------------------------------------
      //  UI helpers
      // ---------------------------------------------------------------
      function updateScore() {
        $("scoreBoard").textContent = "Score: " + score;
      }

      function endGame() {
        clearInterval(gameLoop);
        alert("Game over! Your score: " + score);
        // Reset state and start again
        snake = [{ x: 5, y: 5 }];
        direction = { x: 1, y: 0 };
        pendingDir = null;
        score = 0;
        placeFood();
        updateScore();
        gameLoop = setInterval(tick, 1000 / config.fps);
      }

      // ---------------------------------------------------------------
      //  Start the game
      // ---------------------------------------------------------------
      init();
    </script>
  </body>
</html>

<div class="container mt-3">
  <div class="row">
    <div class="col-md-12">
      <form name="gform" id="glocform" enctype="text/plain" autocomplete="off">
        <div class="input-group">
          <input
            id="q"
            name="q"
            class="form-control"
            type="search"
            placeholder="Query"
            required
          />
          <div class="input-group-append">
            <input type="submit" value="Search" class="btn btn-primary" />
          </div>
        </div>
        <div class="form-group">
          <label for="engineSelect" class="sr-only">Search engine</label>
          <select id="engineSelect" name="engine">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="yahoo">Yahoo</option>
            <option value="wikipedia">Wikipedia</option>
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="wolframalpha">WolframAlpha</option>
            <option value="aol">AOL Search</option>
            <option value="ask">Ask.com</option>
            <option value="ecosia">Ecosia</option>
            <option value="youtube">YouTube</option>
          </select>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/src-engines/scrpt.js"></script>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iK7t1TIq0I4fW0MqJl5uHh8L4u5PTzw1F/spUrSzSt2UDD0gpwMFn7Jq"
      crossorigin="anonymous"
    />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        height: 100%;
        height: 100vh;
        margin: 0px auto;
      }
      .whbody {
        background: #2d6891;
        border: 1px solid #2d6891;
        padding: 5px;
      }
      .card-body {
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
        padding-top: 0px;
        border-bottom: 1px solid grey;
        background: #ffffff;
        margin-bottom: 20px;
        margin-top: 0px;
      }
      .card-body a {
        font-family: "Courier New", Courier, monospace;
        float: right;
        padding: 10px;
      }
      .card-title {
        padding-top: 20px;
      }
      .card-text {
        font-size: 14px;
      }
      .container {
        width: 100%;
        height: 70vh;
        margin-top: 20px;
        overflow-y: auto;
        background: #021f4a;
        border-radius: 5px;
      }
      .container::-webkit-scrollbar {
        width: 5px;
      }
      .container::-webkit-scrollbar-thumb {
        background: #2b2b2bef;
      }
      .container::-webkit-scrollbar-track {
        background: #2b2b2b;
        border: 2px solid white;
      }
      .stickyhd {
        width: 100%;
        top: 0px;
        padding: 0px;
        position: sticky;
        background: #ffffff;
        margin: 0px auto;
        border-radius: 5px;
      }
      .stickyhd img {
        width: 150px;
        padding-left: 10px;
      }
      @media (max-width: 1024px) {
        .container {
          height: 80vh;
        }
        body {
          background: #2d6891;
        }
      }
    </style>
  </head>
  <body>
    <div class="whbody">
      <p class="stickyhd">
        <a target="_blank" id="ch_ref"> <img id="ch_logo" /> </a>
      </p>
      <div class="container mt-3">
        <div id="contentItems">
          <font style="margin-left: 10px" color="grey" size="2">Loading..</font>
        </div>
      </div>
      <p style="width: 100%; text-align: right; font-size: 12px">
        <a
          target="_blank"
          href="https://www.mastrowall.com/"
          style="text-decoration: none; color: #f7f7f7"
        >
          <img
            src="https://mastrowall.com/images/logoCircleBW.png"
            width="20px;"
            style="margin-bottom: -4px; margin-right: 5px"
          />
          M A S T R O W A L L || An Art of Learning
        </a>
      </p>
    </div>
    <script>
      const channel = {
        ch_ref: "https://www.sciencenews.org/",
        ch_logo: "https://i.imgur.com/yBlbXUi.png",
        xml_ref: "https://www.sciencenews.org/feed",
        GS: "AKfycbxO4YmI1DqMup0SWpqHCD9OFyYCtOfPE0vLkKgz0YbWccA3AsubQj3mzwT0UBsHEiqz-w",
      };
      document.getElementById("ch_ref").setAttribute("href", channel.ch_ref);
      document.getElementById("ch_logo").setAttribute("src", channel.ch_logo);
      function convertRSS() {
        fetch(
          `https://script.google.com/macros/s/${channel.GS}/exec?_url=${channel.xml_ref}`
        )
          .then((response) => response.text())
          .then((data) => {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(JSON.parse(data), "text/xml");
            const items = xmlDoc.querySelectorAll("item");
            const contentItemsDiv = document.getElementById("contentItems");
            contentItemsDiv.innerHTML = "";
            items.forEach((item) => {
              const title = item.querySelector("title").textContent;
              const pubDate = item.querySelector("pubDate").textContent;
              const description = item.querySelector("description").textContent;
              const link = item.querySelector("link").textContent;
              const itemDiv = document.createElement("div");
              itemDiv.classList.add("card", "mb-3");
              itemDiv.innerHTML = ` <div class="card-body"> <h4 class="card-title">${title}</h4> <p class="card-text"> <b>Date:</b> ${new Date(
                pubDate
              ).toLocaleDateString()}<br> <b>Description:</b> ${description}<br> <a href="${link}" class="btn btn-primary" target="_blank">Read more</a> </p> </div>`;
              contentItemsDiv.appendChild(itemDiv);
            });
          })
          .catch((error) => {
            console.error(error.message);
            document.getElementById("contentItems").textContent = "ERROR!";
          });
      }
      convertRSS();
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-eOJMYsd53ii+J8J4HVU79uPOFqHH2wFOZh"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
